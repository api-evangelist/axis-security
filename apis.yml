name: Axis Security
description: >-
  Axis Security was a Security Service Edge (SSE) and Zero Trust Network Access
  (ZTNA) vendor founded in 2018 and headquartered in San Mateo, California, with
  research and development in Israel. Its cloud-delivered Atmos platform combined
  ZTNA, a Secure Web Gateway (SWG), Cloud Access Security Broker (CASB) controls,
  and digital experience monitoring to connect users to private applications and
  the internet without a traditional VPN. The company was backed by Canaan
  Partners, Ten Eleven Ventures, Cisco Investments, and Dell Technologies Capital,
  and was acquired by Hewlett Packard Enterprise (HPE) Aruba Networking in 2023,
  where the Atmos technology now lives on as HPE Aruba Networking SSE. This
  API Evangelist profile tracks the company as a portfolio lead; the standalone
  axissecurity.com developer surface has been decommissioned following the
  acquisition, so no live API or developer portal is currently published under
  the Axis Security brand.
